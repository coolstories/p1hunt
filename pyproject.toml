[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p1hunt"
version = "0.1.0"
description = "Authorized critical bug-bounty workflow — a never-quit, safe-harbor swarm (spec.md is the contract)."
readme = "spec.md"
requires-python = ">=3.11"
# claude-agent-sdk is an OPTIONAL runtime dependency. The system defaults to dry-run
# (§9, §13) and is fully runnable and testable without it; install it to enable the
# live agentic "brain".
#
# These two, by contrast, are REQUIRED at runtime even though p1hunt's own modules never
# import them: they are the toolchain of the PROOF HARNESSES the web runner materializes and
# executes. The web scaffolds in p1hunt/agents/harness_scaffold.py emit pytest files that
# `import requests`, and p1hunt/runners/web.py derives a `pytest` argv to run them. Leaving
# them undeclared made a harness die on ModuleNotFoundError — which the parser then read as a
# demonstrated bug. A missing dependency must never be able to masquerade as a finding, so the
# dependency is declared here and the parser treats a collection/import error as ran=False.
# (pytest-cov is deliberately NOT required: the runner asks for --cov and retries without it.)
dependencies = [
  "requests>=2.31",
  "pytest>=7",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.105"]
dev = ["pytest>=7"]

[project.scripts]
p1hunt = "p1hunt.main:main"

[tool.setuptools]
packages = [
  "p1hunt",
  "p1hunt.orchestrator",
  "p1hunt.agents",
  "p1hunt.safety",
  "p1hunt.tools",
  "p1hunt.classify",
  "p1hunt.ui",
  "p1hunt.web",
]

[tool.setuptools.package-data]
"p1hunt.web" = ["static/*"]

# Acceptance tests (§16) use the stdlib unittest runner — no third-party test deps:
#   python3 -m unittest discover -s tests -v
